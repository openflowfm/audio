[package]
name = "audio-flow-harness"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
default-run = "audio-flow-harness"

[profile.profiling]
inherits = "release"
debug = true
strip = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
fundsp = { version = "=0.20.0", default-features = false, features = ["std"] }
oddio = "=0.7.4"
